<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>就医伴侣 · 开发者控制台</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f8fb">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://juyiibanlvzhinengai.tianxinyuan881.workers.dev; img-src data:; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5eaf2;--accent:#2563eb;--accent-soft:#eef4ff;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 520px at 18% -12%,#e8f1ff 0,transparent 60%),var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 80px}
/* 登录 */
.login{min-height:100svh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 24px 60px rgba(15,23,42,.08)}
.mark{width:58px;height:58px;border-radius:16px;background:linear-gradient(140deg,#2563eb,#38bdf8);display:grid;place-items:center;position:relative;box-shadow:0 10px 24px rgba(37,99,235,.28)}
.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:2px}
.mark:before{width:26px;height:6px}.mark:after{width:6px;height:26px}
.login-card h1{font-size:22px;margin:18px 0 4px;letter-spacing:-.3px}
.login-card .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input{width:100%;border:1px solid var(--line);background:#fbfcfe;color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}
input:focus{border-color:#9dbcf7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:11px 16px;font-weight:600}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.msg{font-size:13px;margin:12px 0 0;min-height:20px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin:16px 0 0;line-height:1.6}
/* 控制台 */
.top{position:sticky;top:0;z-index:5;background:rgba(246,248,251,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
.brand .mark{width:32px;height:32px;border-radius:9px;box-shadow:none}
.brand .mark:before{width:15px;height:3.5px}.brand .mark:after{width:3.5px;height:15px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.sp{flex:1}
.sess{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-size:26px;letter-spacing:-.6px}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 15px;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #eef2f7;white-space:nowrap}
th{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#fafcff}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;background:#f1f5f9;color:#475569}
.chip.ok{background:#e9f9ef;color:#15803d}.chip.warn{background:#fff6e6;color:#b45309}.chip.bad{background:#fdecec;color:#b91c1c}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:#0f172a;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;padding:20px;z-index:20}
.dlg{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(15,23,42,.25)}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.dlg .row{display:flex;gap:8px;margin-top:16px}
.dlg .row .btn{flex:1}
.secret{margin-top:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;word-break:break-all}
.secret b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.secret code{font-size:12px}
.count{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 14px 64px}.sess{display:none}}
</style></head>
<body>

<section id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="mark" aria-hidden="true"></div>
    <h1>开发者控制台</h1>
    <p class="sub">就医伴侣 · 仅限唯一管理员</p>
    <label for="key">管理员密钥</label>
    <input id="key" type="password" inputmode="text" autocomplete="current-password" placeholder="输入 Cloudflare Secrets 中的 ADMIN_KEY" required>
    <p id="loginMsg" class="msg" role="status"></p>
    <button id="loginBtn" class="btn" type="submit" style="width:100%;margin-top:8px">登录</button>
    <p class="hint">密钥只用于换取 2 小时临时会话，浏览器不保存密码。连续输错 5 次锁定 10 分钟。</p>
  </form>
</section>

<main id="app" class="wrap" hidden>
  <header class="top" style="margin:-24px -18px 0">
    <div class="top-in">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span>就医伴侣<small>DEVELOPER CONSOLE</small></span></div>
      <div class="sp"></div>
      <span id="sessInfo" class="sess"></span>
      <button id="refresh" class="btn ghost small" type="button">刷新</button>
      <button id="logout" class="btn ghost small" type="button">退出登录</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="cTenants">—</b><span>医院租户</span></div>
    <div class="stat"><b id="cTokens">—</b><span>二维码 Token</span></div>
    <div class="stat"><b id="cAudits">—</b><span>审计记录</span></div>
    <div class="stat"><b id="cBackups">—</b><span>备份快照</span></div>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="tenants" aria-selected="true">医院列表</button>
    <button class="tab" role="tab" data-tab="tokens" aria-selected="false">Token</button>
    <button class="tab" role="tab" data-tab="audit" aria-selected="false">审计日志</button>
    <button class="tab" role="tab" data-tab="backups" aria-selected="false">备份</button>
  </nav>

  <section class="panel" id="panel-tenants"><h2>医院列表</h2><div class="tw"><table><thead><tr><th>tenant_id</th><th>Token 数</th><th>医院目录</th></tr></thead><tbody id="tbTenants"></tbody></table></div><div id="emptyTenants" class="empty" hidden>还没有医院数据</div></section>
  <section class="panel" id="panel-tokens" hidden><h2>二维码 Token</h2><div class="tw"><table><thead><tr><th>医院</th><th>Token</th><th>状态</th><th>到期</th><th>最近扫码</th><th></th></tr></thead><tbody id="tbTokens"></tbody></table></div><div id="emptyTokens" class="empty" hidden>还没有 Token 数据</div></section>
  <section class="panel" id="panel-audit" hidden><h2>审计日志</h2><div class="tw"><table><thead><tr><th>时间</th><th>操作</th><th>对象</th><th>IP</th></tr></thead><tbody id="tbAudit"></tbody></table></div><div id="emptyAudit" class="empty" hidden>还没有审计记录</div></section>
  <section class="panel" id="panel-backups" hidden><h2>备份快照</h2><div class="tw"><table><thead><tr><th>Key</th><th>时间</th><th>范围</th></tr></thead><tbody id="tbBackups"></tbody></table></div><div id="emptyBackups" class="empty" hidden>还没有备份快照</div></section>
</main>

<div id="dlg" class="mask" hidden>
  <form id="dlgForm" class="dlg" autocomplete="off">
    <h3>显示完整 Token</h3>
    <p>再次输入管理员密钥确认身份，显示 30 秒后自动隐藏。</p>
    <label for="dlgKey">管理员密钥</label>
    <input id="dlgKey" type="password" autocomplete="current-password" required>
    <p id="dlgMsg" class="msg" role="status"></p>
    <div id="dlgOut" hidden>
      <div class="secret"><b>KV Key</b><code id="outKey"></code></div>
      <div class="secret"><b>Token</b><code id="outToken"></code></div>
      <div class="count" id="outCount"></div>
    </div>
    <div class="row"><button class="btn ghost" type="button" id="dlgCancel">关闭</button><button class="btn" type="submit" id="dlgBtn">显示</button></div>
  </form>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var API = 'https://juyiibanlvzhinengai.tianxinyuan881.workers.dev';
  var SES_KEY = 'care.console.sess';
  var sess = sessionStorage.getItem(SES_KEY) || '';
  var revealRef = '', revealTimer = 0, lockTimer = 0;

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }
  function fmt(ts) {
    if (!ts) return '—';
    var n = Number(ts); if (!isFinite(n)) return esc(ts);
    if (n < 1e12) n *= 1000;
    var d = new Date(n);
    if (isNaN(d.getTime())) return esc(ts);
    var p = function (x) { return x < 10 ? '0' + x : x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function stateChip(s) {
    var t = String(s || '').toLowerCase();
    if (/active|有效|正常/.test(t)) return '<span class="chip ok">' + esc(s) + '</span>';
    if (/expire|下掉|过期/.test(t)) return '<span class="chip bad">' + esc(s) + '</span>';
    if (/pend|待/.test(t)) return '<span class="chip warn">' + esc(s) + '</span>';
    return '<span class="chip">' + esc(s || 'unknown') + '</span>';
  }
  function api(path, opt) {
    opt = opt || {};
    var headers = { 'Content-Type': 'application/json' };
    if (sess) headers.Authorization = 'Bearer ' + sess;
    return fetch(API + path, { method: opt.method || 'GET', headers: headers, body: opt.body }).then(function (r) {
      return r.text().then(function (t) {
        var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) { }
        if (r.status === 401) { dropSession(); throw new Error((d && d.msg) || '会话已失效'); }
        return { status: r.status, ok: r.ok, data: d };
      });
    });
  }

  function showLogin(msg) {
    $('app').hidden = true; $('login').hidden = false;
    if (msg) { $('loginMsg').textContent = msg; $('loginMsg').className = 'msg err'; }
    setTimeout(function () { try { $('key').focus(); } catch (e) { } }, 60);
  }
  function dropSession() {
    sess = ''; sessionStorage.removeItem(SES_KEY);
    if (lockTimer) { clearInterval(lockTimer); lockTimer = 0; }
    $('loginBtn').disabled = false; $('loginBtn').textContent = '登录';
  }
  function startLock(sec) {
    var left = Math.max(1, Number(sec) || 600);
    $('loginBtn').disabled = true;
    var tick = function () {
      if (left <= 0) { clearInterval(lockTimer); lockTimer = 0; $('loginBtn').disabled = false; $('loginBtn').textContent = '登录'; $('loginMsg').textContent = ''; return; }
      var m = Math.floor(left / 60), s = left % 60;
      $('loginBtn').textContent = '已锁定 ' + m + ':' + (s < 10 ? '0' + s : s);
      left--;
    };
    tick(); lockTimer = setInterval(tick, 1000);
  }

  function enterApp() {
    $('login').hidden = true; $('app').hidden = false;
    $('sessInfo').textContent = '会话 2 小时 · 临时令牌';
    loadAll();
  }

  function loadAll() {
    Promise.all([
      api('/api/admin/overview'), api('/api/admin/tenants'), api('/api/admin/tokens'),
      api('/api/admin/audit'), api('/api/admin/backups')
    ]).then(function (r) {
      var o = (r[0].data && r[0].data.counts) || {};
      $('cTenants').textContent = o.tenants == null ? '—' : o.tenants;
      $('cTokens').textContent = o.tokens == null ? '—' : o.tokens;
      $('cAudits').textContent = o.audits == null ? '—' : o.audits;
      $('cBackups').textContent = o.backups == null ? '—' : o.backups;
      renderTenants((r[1].data && r[1].data.tenants) || []);
      renderTokens((r[2].data && r[2].data.tokens) || []);
      renderAudit((r[3].data && r[3].data.rows) || []);
      renderBackups((r[4].data && r[4].data.rows) || []);
    }).catch(function (e) {
      if (!sess) showLogin(e.message || '请先登录');
      else toast(e.message || '加载失败');
    });
  }

  function renderTenants(rows) {
    $('tbTenants').innerHTML = rows.map(function (t) {
      return '<tr><td class="mono">' + esc(t.tenant_id) + '</td><td>' + esc(t.tokens) + '</td><td>' + (t.catalog ? '<span class="chip ok">已配置</span>' : '<span class="chip">未配置</span>') + '</td></tr>';
    }).join('');
    $('emptyTenants').hidden = rows.length > 0;
  }
  function renderTokens(rows) {
    $('tbTokens').innerHTML = rows.map(function (t) {
      return '<tr><td class="mono">' + esc(t.tenant_id) + '</td><td class="mono">' + esc(t.masked) + '</td><td>' + stateChip(t.state) + '</td><td>' + fmt(t.expires_at) + '</td><td>' + fmt(t.last_scan) + '</td><td><button class="btn ghost small" type="button" data-reveal="' + esc(t.ref) + '">显示</button></td></tr>';
    }).join('');
    $('emptyTokens').hidden = rows.length > 0;
  }
  function renderAudit(rows) {
    $('tbAudit').innerHTML = rows.map(function (a) {
      return '<tr><td>' + fmt(a.at || a.time) + '</td><td class="mono">' + esc(a.op || a.action || '') + '</td><td class="mono">' + esc(a.detail || a.tenant_id || '') + '</td><td class="mono">' + esc(a.ip || '') + '</td></tr>';
    }).join('');
    $('emptyAudit').hidden = rows.length > 0;
  }
  function renderBackups(rows) {
    $('tbBackups').innerHTML = rows.map(function (b) {
      return '<tr><td class="mono">' + esc(b.key) + '</td><td>' + fmt(b.at || b.created || b.time) + '</td><td class="mono">' + esc(b.tenant_id || b.scope || '') + '</td></tr>';
    }).join('');
    $('emptyBackups').hidden = rows.length > 0;
  }

  function openReveal(ref) {
    revealRef = ref;
    $('dlg').hidden = false; $('dlgKey').value = ''; $('dlgMsg').textContent = '';
    $('dlgOut').hidden = true; $('dlgBtn').disabled = false; $('dlgBtn').textContent = '显示';
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = 0; }
    setTimeout(function () { try { $('dlgKey').focus(); } catch (e) { } }, 60);
  }
  function closeReveal() {
    $('dlg').hidden = true; $('dlgKey').value = '';
    $('outKey').textContent = ''; $('outToken').textContent = '';
    revealRef = '';
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = 0; }
  }

  // 登录
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var key = $('key').value;
    if (!key) return;
    $('loginBtn').disabled = true; $('loginBtn').textContent = '验证中…';
    $('loginMsg').textContent = ''; $('loginMsg').className = 'msg';
    fetch(API + '/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key })
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = null; try { d = t ? JSON.parse(t) : null; } catch (err) { }
        if (!r.ok || !d || !d.ok) {
          $('loginBtn').disabled = false; $('loginBtn').textContent = '登录';
          if (d && d.code === 'ADMIN_LOCKED') { startLock(d.retry_after || 600); $('loginMsg').textContent = d.msg || '已锁定'; $('loginMsg').className = 'msg err'; return; }
          var extra = d && d.remaining ? '（还可试 ' + d.remaining + ' 次）' : '';
          $('loginMsg').textContent = ((d && d.msg) || '登录失败') + extra;
          $('loginMsg').className = 'msg err';
          return;
        }
        sess = d.token; sessionStorage.setItem(SES_KEY, sess);
        $('key').value = '';
        $('loginBtn').disabled = false; $('loginBtn').textContent = '登录';
        enterApp();
      });
    }).catch(function () {
      $('loginBtn').disabled = false; $('loginBtn').textContent = '登录';
      $('loginMsg').textContent = '网络异常，请稍后重试'; $('loginMsg').className = 'msg err';
    });
  });

  // 会话恢复
  if (sess) {
    api('/api/admin/session').then(function (r) {
      if (r.ok && r.data && r.data.ok) enterApp(); else { dropSession(); showLogin(); }
    }).catch(function () { dropSession(); showLogin(); });
  } else {
    showLogin();
  }

  // 顶部
  $('refresh').addEventListener('click', function () { loadAll(); toast('已刷新'); });
  $('logout').addEventListener('click', function () {
    api('/api/admin/logout', { method: 'POST' }).catch(function () { });
    dropSession(); showLogin('已退出登录');
    $('loginMsg').textContent = '已退出登录'; $('loginMsg').className = 'msg ok';
  });

  // Tab
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.getAttribute('data-tab');
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      ['tenants', 'tokens', 'audit', 'backups'].forEach(function (k) { $('panel-' + k).hidden = k !== name; });
    });
  });

  // 显示完整 Token
  $('tbTokens').addEventListener('click', function (e) {
    var b = e.target.closest('[data-reveal]');
    if (b) openReveal(b.getAttribute('data-reveal'));
  });
  $('dlgForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var key = $('dlgKey').value;
    if (!key || !revealRef) return;
    $('dlgBtn').disabled = true; $('dlgBtn').textContent = '验证中…';
    $('dlgMsg').textContent = '';
    api('/api/admin/reveal', { method: 'POST', body: JSON.stringify({ key: key, ref: revealRef }) }).then(function (r) {
      $('dlgBtn').disabled = false; $('dlgBtn').textContent = '显示';
      if (!r.ok || !r.data || !r.data.ok) {
        $('dlgMsg').textContent = (r.data && r.data.msg) || '验证失败';
        $('dlgMsg').className = 'msg err';
        return;
      }
      $('dlgKey').value = '';
      $('outKey').textContent = r.data.key || '';
      $('outToken').textContent = r.data.token || '';
      $('dlgOut').hidden = false;
      $('dlgMsg').textContent = ''; $('dlgMsg').className = 'msg';
      var left = 30;
      $('outCount').textContent = '将在 ' + left + ' 秒后自动隐藏';
      if (revealTimer) clearTimeout(revealTimer);
      var tick = setInterval(function () {
        left--;
        if (left <= 0) { clearInterval(tick); closeReveal(); return; }
        $('outCount').textContent = '将在 ' + left + ' 秒后自动隐藏';
      }, 1000);
      revealTimer = tick;
    }).catch(function () {
      $('dlgBtn').disabled = false; $('dlgBtn').textContent = '显示';
      $('dlgMsg').textContent = '网络异常'; $('dlgMsg').className = 'msg err';
    });
  });
  $('dlgCancel').addEventListener('click', closeReveal);
  $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) closeReveal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('dlg').hidden) closeReveal(); });
  // 控制台不做缓存，避免残留旧页面
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () { });
  }
})();
</script>
