<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>就医伴侣 医院配置生成器</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#16302b;--mute:#5b6f6a;--line:#d5e0dd;--acc:#0f766e;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#16241f;--ink:#e4efec;--mute:#9bb0aa;--line:#2b3f39;--acc:#34b3a5;--warn:#f0b35a;--bad:#f08080}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.sub{color:var(--mute);font-size:14px;margin:4px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
input[type=color]{padding:2px;width:64px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;padding:8px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.d{color:var(--bad)}
.notice{border-left:4px solid var(--warn);background:rgba(180,83,9,.08);padding:10px 12px;border-radius:8px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips label{display:inline-flex;align-items:center;font-weight:400;margin:4px 12px 4px 0}
h2{cursor:pointer}.card h2::before{content:'▾ ';opacity:.6}.card.closed h2::before{content:'▸ '}.card.closed .body{display:none}.card .body{margin-top:8px}
#msg{color:var(--bad);font-size:14px;white-space:pre-wrap}#msg:not(:empty){position:fixed;left:8px;right:8px;bottom:64px;max-height:50vh;overflow:auto;background:var(--card);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:9}#msg button{margin:8px 8px 0 0}
</style></head><body><main>
<h1>医院配置生成器</h1>
<p class="sub">在本页填写医院信息，导出一个配置文件发给我们上线。全程在您的浏览器里完成，内容不会上传到任何服务器，也没有账号。</p>
<div class="notice"><b>免责声明：</b>本配置内所有服务描述、跳转页面内容由医疗机构自行负责，仅用于展示和挂载跳转链接，不提供诊疗建议；相关内容须符合广告法、医疗广告管理办法等法规。配置文件是公开可访问的文件，请不要填写敏感信息；核销密码只作现场轻量核验，不是强安全凭证。</div>
<p class="sub">“预览患者端”会打开和本页同一文件夹下的 index.html，请确认它就是准备上线的版本。如果显示“预览不可用”，不影响导出：直接导出发给我们，我们上线后会发正式链接请您核对。</p>
<div id="app"></div>
<div id="msg" role="alert"></div>
</main>
<div class="bar"><label class="p" style="margin:0"><input type="file" id="imp" accept=".json,application/json" hidden><button type="button" onclick="imp.click()">导入已有配置</button></label><button type="button" id="pv">预览患者端</button><button type="button" id="clr">清空重填</button><button class="p" id="exp" type="button">导出配置文件</button></div>
<script>
const DEPTS=['内科','外科','妇产科','儿科','骨科 / 康复','口腔科','皮肤科','眼科','耳鼻喉科','中医科','体检中心'];
const BAN=['治愈','根治','包治','保证疗效','疗效','最佳','最好','唯一','国家级','药','保健品','医疗器械','秒杀','永久'],HARD=['治愈','根治','包治','保证疗效','国家级','秒杀'];
let S=blank();
function blank(){return{hours:'',dis:null,jnyMeta:[],key:'',n:'',w:'',c:'#0f766e',l:'',splash:'',icp:'',gaba:'',up:'',tk:'',dept:[],tel:{n:'',num:''},book:{n:'',url:''},vip:[],ann:[],pre:[],sched:[],show:[],campus:[],act:[],jnyText:''}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
const inp=(p,l,ph,t)=>`<div><label>${l}</label><input data-p="${p}" ${t?'type="'+t+'"':''} value="${esc(get(S,p))}" placeholder="${esc(ph||'')}"></div>`;
const sel=(p,l,opts)=>{const v=String(get(S,p)||''),L=v&&!opts.includes(v)?[v].concat(opts):opts;return `<div><label>${l}</label><select data-p="${p}"><option value="">请选择</option>${L.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`};
const list=(p,title,hint,fields,max)=>`<div class="card"><h2>${title}</h2><p class="sub">${hint}</p>${(S[p]||[]).map((x,i)=>`<div class="item"><div class="row">${fields.map(f=>Array.isArray(f[3])?sel(p+'.'+i+'.'+f[0],f[1],f[3]):inp(p+'.'+i+'.'+f[0],f[1],f[2],f[3])).join('')}</div><button class="d" data-del="${p}.${i}" type="button">删除</button></div>`).join('')}<button data-add="${p}" type="button" ${(S[p]||[]).length>=max?'disabled':''}>添加</button></div>`;
function render(){
const a=document.getElementById('app');
a.innerHTML=`<div class="card"><h2>基本信息（必填：代号和医院名称）</h2><div class="row">${inp('key','医院代号（必填。由我们统一分配，请向我们确认，不要自己编）','请向交付人员获取')}${inp('n','医院名称（必填）','如 某某口腔门诊')}</div>${inp('w','首页引导语','一句话，如 本工具由门诊提供，协助患者整理就诊资料')}${inp('splash','启动页一句话（可留空；患者首次打开时全屏显示 2 秒）','如 您的就诊资料，由您自己保管')}${inp('icp','网站备案号（共用域名的备案号，由我们填写；医院不用填，留空）','如 沪ICP备12345678号')}${inp('gaba','公安联网备案号（由我们填写；医院不用填，留空）','如 沪公网安备 31010402001234号')}<div class="row"><div><label>主题色</label><input type="color" data-p="c" value="${esc(S.c)}"></div><div><label>院徽（图片，会缩小到 96 像素）</label><input type="file" id="logo" accept="image/png,image/jpeg,image/webp"></div></div>${S.l?'<p class="sub">已选院徽 <img src="'+S.l+'" alt="" style="height:28px;vertical-align:middle"> <button data-act="nologo" type="button">去掉</button></p>':''}</div>
<div class="card"><h2>开放科室</h2><p class="sub">升级版：不勾选则开放全部科室。基础版合同最多 3 个科室，请按合同勾选，超出部分患者端不会显示。</p><div class="chips">${DEPTS.map(d=>`<label><input type="checkbox" data-dept="${d}" ${S.dept.includes(d)?'checked':''}>${d}</label>`).join('')}</div></div>
<div class="card"><h2>联系和预约</h2><div class="row">${inp('tel.n','电话名称','如 门诊服务电话')}${inp('tel.num','电话号码','如 021-12345678')}</div><div class="row">${inp('book.n','预约入口名称','如 门诊官方预约入口')}${inp('book.url','预约链接（https，须是医院自己的页面）','https://')}</div><p class="sub">只做跳转，不收集患者信息。</p>${inp('hours','门诊时间（可选，会作为“门诊时间”一条显示在 VIP 说明最前面）','如 周一至周六 8:30–17:30')}</div>`
+`<div class="card"><h2>复诊打卡记录上传（可选）</h2><p class="sub">填了这两项，患者的复诊打卡和凭证核销记录才会汇总到医院后台，医院才能按月看到「多少人按时回来复诊了」。不填也能正常用，只是没有汇总。上传地址和口令在后台「患者页上传设置」里复制，由我们开通。</p><div class="row">${inp('up','上传地址（可留空）','https://…/api/public/visit-events')}</div><div class="row">${inp('tk','上传口令（可留空；64 位小写字母和数字）','从后台“患者页上传设置”里复制')}</div><p class="sub">提醒：配置文件是公开文件，这里只填上传口令，不要填患者密码、身份证或病历内容。</p></div>`
+list('vip','VIP 权益说明','只展示，不办理、不预订；不得写诊疗建议或疗效。',[['t','标题','如 专属服务电话'],['d','说明','']],30)
+list('ann','通知和健康科普','由医院发布，内容须经医院审核。',[['t','标题',''],['d','内容',''],['date','日期','2026-10-01']],30)
+list('show','医院项目展示','只写“这是什么”，不写适合谁、效果、疗程；价格不填则显示“以门诊公示为准”。基础版最多 3 个，升级版最多 8 个。图片不在这里上传：请把图片文件发给我们，由我们放入站点；图片名写成 img/医院代号/文件名.jpg（jpg、png、webp，每张建议小于 150KB）。患者点“加入想问清单”只是记到自己的复诊摘要，不是预约。',[['t','项目名称（≤30字）','如 儿童口腔检查'],['d','一句话说明（≤120字）','只写这是什么'],['img','图片（可空）','img/代号/oral.jpg'],['price','价格文字（可空，≤30字）','以门诊公示为准'],['tag','分类（可空，≤10字）','如 口腔']],8)
+list('pre','检查前准备','一般提示，具体以医院通知为准。',[['t','标题','如 空腹抽血'],['d','说明','']],30)
+list('sched','出诊时间表','按周固定排班：周几、时段从下拉里选。只写科室和医生姓名，不写评价、疗效或“名医”之类的词；临时停诊以医院通知为准，由医院自己维护更新。',[['wd','周几','周一',['周一','周二','周三','周四','周五','周六','周日']],['ap','时段','上午',['上午','下午','晚间','全天']],['st','开始时间（可空）','08:30','time'],['et','结束时间（可空）','11:30','time'],['dp','科室','口腔科'],['dr','医生','某医生'],['nt','备注（可空）','']],60)
+`<div class="card"><h2>就诊流程清单</h2><p class="sub">把医院已有的准备流程写成患者可勾选的步骤，勾选只保存在患者手机里。每个流程之间空一行；第一行是流程名称，后面每行一个步骤，需要说明时用「｜」隔开，如：按要求禁食｜以医院发的说明为准。最多 6 个流程，每个流程最多 15 步。不得写诊疗建议或疗效。</p><textarea data-p="jnyText" rows="10" placeholder="胃肠镜检查准备&#10;确认检查时间和地点｜看预约短信&#10;按医院要求准备饮食&#10;携带证件和既往报告" style="width:100%;font:inherit">${esc(S.jnyText||'')}</textarea></div>`
+list('campus','院区信息','多院区时填写。',[['n','院区名称',''],['addr','地址',''],['tel','电话','']],10)
+`<div class="card"><h2>惠民服务（抽签筒、小转盘）</h2><p class="sub">奖品和服务由医院自己提供、自己发放；抽到“谢谢参与”也会用掉当天的参与机会；抽中后患者得到兑换凭证，到院由工作人员核销。每个活动 2–12 个奖项，最多 10 个活动。</p>${S.act.map((x,i)=>`<div class="item"><div class="row">${inp('act.'+i+'.t','活动名称','如 门诊惠民小转盘')}<div><label>类型</label><select data-p="act.${i}.kind"><option value="wheel" ${x.kind==='wheel'?'selected':''}>小转盘</option><option value="draw" ${x.kind==='draw'?'selected':''}>抽签筒</option></select></div><div><label>参与频率</label><select data-p="act.${i}.per"><option value="day" ${x.per==='day'?'selected':''}>同一设备每天一次</option><option value="once" ${x.per==='once'?'selected':''}>同一设备仅一次</option><option value="free" ${x.per==='free'?'selected':''}>不限次数（只展示内容，无凭证）</option></select></div></div><div class="row">${inp('act.'+i+'.need','需要整理打卡次数（0=不需要，最多 10。患者勾完一个就诊流程记 1 次（每天最多 1 次）；复诊后保存“复诊后记录”每次复诊记 1 次）','0','number')}</div><div class="row">${inp('act.'+i+'.start','活动开始日期（可不填）','2026-10-01','date')}${inp('act.'+i+'.end','活动结束日期（可不填，过期后患者不能再参与）','2026-10-07','date')}</div><div class="row">${inp('act.'+i+'.valid','凭证有效天数','30','number')}${inp('act.'+i+'.pin','工作人员确认码（原“核销密码”，4–6 位数字；只防误点，不是安全凭证，会写入公开配置）','6 位不连号数字，不要用 1234、2468、000000')}</div>${inp('act.'+i+'.rule','活动规则','如 同一设备每天一次，30 天内有效')}${inp('act.'+i+'.note','说明','如 服务由门诊提供')}<p class="sub"><b>奖项</b></p>${x.items.map((it,j)=>`<div class="item"><div class="row">${inp('act.'+i+'.items.'+j+'.t','奖项名称','如 停车券一张（医疗类奖品须经医院审批）')}${inp('act.'+i+'.items.'+j+'.g','等级','如 一等奖')}${inp('act.'+i+'.items.'+j+'.q','数量说明（只是显示文字，不会自动控制数量）','如 数量以现场实际供应为准')+inp('act.'+i+'.items.'+j+'.w','抽中权重（可空；留空时按等级默认：一等奖 1、二等奖 2、其他和“谢谢参与”3，数字越大越容易抽中，不是保证）','默认','number')}</div>${inp('act.'+i+'.items.'+j+'.d','兑换说明','如 到前台兑换')}<label style="font-weight:400"><input type="checkbox" data-n="act.${i}.items.${j}" ${it.n?'checked':''}>这是“谢谢参与”（没有服务）</label> <button class="d" data-del="act.${i}.items.${j}" type="button">删除奖项</button></div>`).join('')}<button data-additem="${i}" type="button" ${x.items.length>=12?'disabled':''}>添加奖项</button> <button class="d" data-del="act.${i}" type="button">删除活动</button></div>`).join('')}<button data-add="act" type="button" ${S.act.length>=10?'disabled':''}>添加活动</button></div>`;
}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){let v=t.value;if(t.type==='number')v=+v||0;if(t.dataset.p==='key'){const old=S.key||'',nw=String(v).trim();if(old&&nw&&old!==nw&&/^[A-Za-z0-9_-]{1,30}$/.test(nw))S.act.forEach(a=>{if(typeof a.id==='string'&&a.id.indexOf(old+'-')===0)a.id=nw+a.id.slice(old.length)})}set(t.dataset.p,v)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.dept){const d=t.dataset.dept;S.dept=S.dept.filter(x=>x!==d);if(t.checked)S.dept.push(d)}
if(t.dataset.n){set(t.dataset.n+'.n',t.checked)}

if(t.id==='logo'&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=96/Math.max(im.width,im.height,96),c=document.createElement('canvas');c.width=Math.round(im.width*Math.min(k,1)); c.height=Math.round(im.height*Math.min(k,1));c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.l=c.toDataURL('image/png');render()};im.src=r.result};r.readAsDataURL(f)}
if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(Array.isArray(o.act)&&(o.act.length>10||o.act.some(x=>!x||!Array.isArray(x.items)||x.items.length<2||x.items.length>12))){msg('导入的文件里活动超过 10 个，或某个活动的奖项不在 2–12 个之内，请先在原文件中修正。');return}S=Object.assign(blank(),o,{key:(/^[A-Za-z0-9_-]{1,30}$/.test(o.key||o.hid||'')?(o.key||o.hid):(t.files[0].name||'').replace(/\.json$/i,'').replace(/[^\w-]/g,'').slice(0,30).replace(/^(?=.{0,3}$).*$/,'').replace(/^[_-]+$/,''))});S.tel=S.tel||{n:'',num:''};S.book=S.book||{n:'',url:''};S.dept=S.dept||[];S.jnyText=(Array.isArray(o.jny)?o.jny:[]).map(j=>[j.t].concat((j.steps||[]).map(x=>x.t+(x.d?'｜'+x.d:''))).join('\n')).join('\n\n');['vip','ann','pre','campus','sched'].forEach(k=>S[k]=S[k]||[]);S.hours='';{const hi=S.vip.findIndex(x=>x&&x.t==='门诊时间');if(hi>=0){S.hours=S.vip[hi].d||'';S.vip.splice(hi,1)}}S.dis=Array.isArray(o.dis)?o.dis:null;S.jnyMeta=(Array.isArray(o.jny)?o.jny:[]).map(j=>({id:j&&j.id,t:j&&j.t,note:j&&j.note}));S.act=(S.act||[]).map(a=>Object.assign({kind:'wheel',per:'day',valid:30,pin:'',rule:'',note:'',items:[]},a,{need:Math.min(10,parseInt(a.need,10)||(a.ci?1:0))},{items:(a.items||[]).map(x=>typeof x==='string'?{t:x,n:/^谢谢参与/.test(x)}:x)}));render();msg(/^[A-Za-z0-9_-]{1,30}$/.test(o.key||o.hid||'')?'':(S.key?'已导入。医院代号暂按文件名“'+S.key+'”填入，请核对是否是我们分配给您的代号，不对请改。':'已导入。文件里没有医院代号，文件名也无法识别，请在“基本信息”里填写我们分配给您的代号。'))}catch(_){msg('这个文件不是有效的配置文件')}};r.readAsText(t.files[0])}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.add){const p=t.dataset.add;if(p==='act')S.act.push({id:(S.key||'h')+'-a'+(S.act.length+1),t:'',kind:'wheel',per:'day',valid:30,pin:'',rule:'',note:'',items:[{t:'',g:'',q:'',d:''},{t:'谢谢参与',n:true}]});else S[p].push(p==='campus'?{n:'',addr:'',tel:''}:p==='show'?{t:'',d:'',img:'',price:'',tag:''}:p==='ann'?{t:'',d:'',date:''}:p==='sched'?{wd:'',ap:'',st:'',et:'',dp:'',dr:'',nt:''}:{t:'',d:''});render()}
if(t.dataset.additem){S.act[+t.dataset.additem].items.push({t:'',g:'',q:'',d:''});render()}
if(t.dataset.del){const ks=t.dataset.del.split('.'),i=+ks.pop();get(S,ks.join('.')).splice(i,1);render()}
