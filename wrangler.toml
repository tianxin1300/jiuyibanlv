# 就医智能端 · 后端（Cloudflare Worker）配置
# 注意：本文件只是部署所需配置，不执行任何 Cloudflare 连接/授权/部署操作（部署由你本人操作）。
# 钥匙一律不写在这里，只在 Cloudflare 面板 Worker「设置 → 变量和机密 → 机密」里填：
#   GEMINI_KEYS / GROQ_KEYS / OPENROUTER_KEYS / COZE_API_TOKEN / COZE_BOT_ID 等。
# keep_vars = true：每次部署都保留面板里手动填的机密，不会把它们清掉。

name = "juyiibanlvzhinengai"
keep_vars = true
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 医院任务：每个 task_id 对应一个 Durable Object，在事务内推进步骤并记录幂等结果。
[[durable_objects.bindings]]
name = "CARE_TASKS"
class_name = "CareTask"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CareTask"]

# 数据存储：用户/历史/记忆/待办/知识库/分享/定时任务等存 KV（绑定名必须是 KV）。
[[kv_namespaces]]
binding = "KV"
id = "6f56242d19284338b3d2332d823e412d"

# 医院公开目录素材：默认用 KV 兜底存储，部署不再依赖预先创建 R2 bucket。
# 若要启用 R2（2 MiB 图片、独立素材桶），先执行 `npx wrangler r2 bucket create jiuyibanlv-care-assets`，
# 再打开下面三行并重新部署；代码会自动优先使用 R2，缺失时回落到 KV。
# [[r2_buckets]]
# binding = "CARE_ASSETS"
# bucket_name = "jiuyibanlv-care-assets"

# 每日北京时间 00:00（UTC 16:00）执行：到点提醒、定时任务、患者码过期下线与 30 天清理。
[triggers]
crons = ["0 16 * * *"]

# 环境标记：测试清除接口只在 APP_ENV=test 时可用，避免误清生产数据。
[vars]
APP_ENV = "production"

# 测试/生产隔离（建议）：在 Cloudflare 另建 test 环境的 Worker、KV、R2、DO 和 Secrets 后，
# 取消下面注释并填入真实资源 ID。不要复用生产 KV。
# [env.test]
# name = "juyiibanlvzhinengai-test"
# [env.test.vars]
# APP_ENV = "test"
# [[env.test.kv_namespaces]]
# binding = "KV"
# id = "<测试 KV namespace id>"
# [[env.test.durable_objects.bindings]]
# name = "CARE_TASKS"
# class_name = "CareTask"
