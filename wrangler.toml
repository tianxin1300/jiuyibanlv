# 就医智能端 · 后端（Cloudflare Worker）配置
# 注意：本文件只是部署所需配置，不执行任何 Cloudflare 连接/授权/部署操作（部署由你本人操作）。
# 钥匙一律不写在这里，只在 Cloudflare 面板 Worker「设置 → 变量和机密 → 机密」里填：
#   GEMINI_KEYS / GROQ_KEYS / OPENROUTER_KEYS / COZE_API_TOKEN / COZE_BOT_ID 等。
# keep_vars = true：每次部署都保留面板里手动填的机密，不会把它们清掉。

name = "juyiibanlvzhinengai"
keep_vars = true
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 医院任务：每个 task_id 对应一个 Durable Object，在事务内推进步骤并记录幂等结果。
[[durable_objects.bindings]]
name = "CARE_TASKS"
class_name = "CareTask"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CareTask"]

# 数据存储：用户/历史/记忆/待办/知识库/分享/定时任务等存 KV（绑定名必须是 KV）。
[[kv_namespaces]]
binding = "KV"
id = "6f56242d19284338b3d2332d823e412d"
